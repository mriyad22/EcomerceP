{% extends 'master/base.html' %}
{% load crispy_forms_tags %}

{% block title %}
  {{ title }}
{% endblock %}

{% block content %}
  <div class="container">
    <div class="col-lg-5">
      <div class="form-card">
        <h5 class="fw-bold">{{page_title}}</h5>

        <form method="post" enctype="multipart/form-data" class="mt-3">
          {% csrf_token %}
          {{ data|crispy }}

          <button class="btn btn-primary">{{btn}}</button>
        </form>

      </div>
    </div>
  </div>
{% endblock %}
