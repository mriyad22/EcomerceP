{% extends 'master/base.html' %}
{% load crispy_forms_tags %}
{% block title %}
  Add Address | ShopSphere
{% endblock %}
{% block content %}
  <section class="section-sm">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="form-card">
            <span class="eyebrow">Delivery</span><h1 class="section-title mt-1">Add a new address</h1><p class="text-muted">We'll use this address for your order.</p>

            <form method="post" class="mt-4">
              {% csrf_token %}
              {{ form | crispy }}
              <div class="d-flex gap-2">
                <a href="{% url 'order:checkout' %}" class="btn btn-light border">Cancel</a>
                <button class="btn btn-primary">Save address</button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
